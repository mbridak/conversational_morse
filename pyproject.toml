[project]
name = "conversational-morse"
dynamic = ["version"]
description = "Practice realistic CW QSOs with a K1EL WinKeyer USB"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Bridak", email = "michael.bridak@gmail.com" },
]
keywords = [
    "amateur-radio",
    "cw",
    "ham-radio",
    "morse-code",
    "pyqt6",
    "qso",
    "winkeyer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Education",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PyQt6>=6.6",
    "pyserial>=3.5",
    "pydantic>=2.6",
]

[project.scripts]
conversational-morse = "conversational_morse.__main__:main"

[project.urls]
Homepage = "https://github.com/mbridak/conversational-morse"
Repository = "https://github.com/mbridak/conversational-morse"
Issues = "https://github.com/mbridak/conversational-morse/issues"
Changelog = "https://github.com/mbridak/conversational-morse/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/conversational_morse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/conversational_morse"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/main.py",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["serial.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
